/* 文档静态终端，仅承载认证交互预览。 */
.prototype-terminal{
  position:absolute;
  inset:0;
  padding:12px;
  overflow:hidden;
  color:var(--r-terminal-text);
  font-family:var(--rivet-font-family);
  font-size:var(--r-font-size-base);
  line-height:1.55;
  white-space:pre-wrap;
}
.prototype-terminal-user{color:var(--r-terminal-rx)}
.prototype-terminal-path{color:var(--r-terminal-info)}
.prototype-terminal-muted{color:var(--r-muted)}
.prototype-terminal-cursor{
  display:inline-block;
  width:7px;
  height:14px;
  vertical-align:-2px;
  background:var(--r-terminal-text);
}
.prototype-auth-line{display:flex;align-items:center;min-height:22px}
.prototype-auth-input{
  width:180px;
  height:22px;
  padding:0 2px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--r-terminal-text);
  font:inherit;
  line-height:inherit;
  caret-color:var(--r-terminal-text);
}
.prototype-auth-input:focus{box-shadow:none}

/* panel-view 只负责原型多级页面切换；正式面板内部同样是纵向 flex 布局。 */
.panel-view{
  display:flex;
  min-height:0;
  flex:1;
  flex-direction:column;
}
.panel-view[hidden]{display:none}

/* 高级选项入口沿用 terminal-group-header 的高度、间距和交互。 */
.ssh-advanced-toggle{
  display:flex;
  width:calc(100% + 24px);
  height:34px;
  margin:8px -12px 0;
  align-items:center;
  gap:7px;
  padding:0 11px;
  border:0;
  border-top:1px solid var(--r-border);
  border-bottom:1px solid var(--r-border);
  background:transparent;
  color:var(--r-subtle);
  cursor:pointer;
  text-align:left;
}
.ssh-advanced-toggle:hover{background:var(--r-surface-2)}
.ssh-advanced-toggle strong{
  color:var(--r-text);
  font-size:var(--r-font-size-base);
  font-weight:600;
}
.ssh-advanced-toggle small{
  margin-left:auto;
  color:var(--r-muted);
  font-size:var(--r-font-size-secondary);
}
.ssh-advanced-chevron{transition:transform .15s ease}
.ssh-advanced-toggle.is-collapsed .ssh-advanced-chevron{transform:rotate(-90deg)}
.ssh-advanced-body{padding-top:11px}
.ssh-advanced-body[hidden]{display:none}

/* 跳板机行使用正式 Switch 尺寸，说明文字沿用基础/次级字号。 */
.ssh-jump-row{
  display:flex;
  min-height:34px;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
}
.ssh-jump-copy{
  display:flex;
  min-width:0;
  flex:1;
  flex-direction:column;
}
.ssh-jump-copy strong{
  color:var(--r-text);
  font-size:var(--r-font-size-base);
  font-weight:500;
}
.ssh-jump-copy small{
  margin-top:2px;
  color:var(--r-muted);
  font-size:var(--r-font-size-secondary);
}
.ssh-jump-field{margin-bottom:11px}
.ssh-jump-field[hidden]{display:none}

/* 端口转发入口与 terminal-connection-row 同尺寸，不使用卡片。 */
.ssh-forward-entry{
  display:flex;
  width:calc(100% + 24px);
  min-height:44px;
  align-items:center;
  gap:10px;
  margin:3px -12px 0;
  padding:5px 11px 5px 17px;
  border:0;
  border-top:1px solid var(--r-border);
  border-bottom:1px solid var(--r-border);
  background:transparent;
  color:inherit;
  cursor:pointer;
  text-align:left;
}
.ssh-forward-entry:hover{background:var(--r-surface-2)}
.ssh-forward-entry-copy{
  display:flex;
  min-width:0;
  flex:1;
  flex-direction:column;
}
.ssh-forward-entry-copy strong{
  color:var(--r-text);
  font-size:var(--r-font-size-base);
  font-weight:600;
}
.ssh-forward-entry-copy small{
  margin-top:2px;
  overflow:hidden;
  color:var(--r-muted);
  font-size:var(--r-font-size-secondary);
  text-overflow:ellipsis;
  white-space:nowrap;
}
.ssh-forward-entry-count{
  flex:0 0 auto;
  color:var(--r-muted);
  font-size:var(--r-font-size-secondary);
}

/* 嵌套页面标题返回键保持 terminal-icon-button 尺寸。 */
.ssh-subpage-title{
  display:flex;
  min-width:0;
  align-items:center;
  gap:5px;
}

/* 转发列表完全复用连接列表行、类型图标、更多菜单和删除确认。 */
.ssh-forward-list{min-height:0;flex:1}
.ssh-forward-list .terminal-connection-row{padding-right:7px}
.ssh-forward-list .terminal-connection-type{
  color:var(--r-primary-light);
  font-weight:700;
  font-size:var(--r-font-size-secondary);
}
.ssh-forward-list .terminal-more-wrap{z-index:2}
.ssh-forward-menu[hidden]{display:none}
.ssh-forward-delete[hidden]{display:none}

/* 转发编辑表单继续使用 terminal-field 及其 34px 控件。 */
.ssh-forward-form{
  display:flex;
  min-height:0;
  flex:1;
  flex-direction:column;
}
.ssh-forward-form-viewport>div{padding:12px}
.ssh-forward-field-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 76px;
  gap:8px;
}

/* 模拟 VerticalScrollbar 结构，尺寸直接来自正式组件。 */
.prototype-scroll{
  position:relative;
  min-height:0;
  flex:1;
  overflow:hidden;
}
.prototype-scroll-viewport{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:5px;
  scrollbar-width:none;
  overscroll-behavior:contain;
}
.prototype-scroll-viewport::-webkit-scrollbar{display:none;width:0;height:0}
.prototype-scroll-track{
  position:absolute;
  top:4px;
  right:2px;
  bottom:4px;
  width:8px;
  border-radius:999px;
  background:var(--r-scrollbar-track);
}
.prototype-scroll-thumb{
  position:absolute;
  left:2px;
  top:0;
  width:5px;
  min-height:24px;
  border-radius:999px;
  background:var(--r-scrollbar-thumb);
}

/* 原型状态入口不属于正式 UI；只通过 URL query 使用，不在界面显示。 */
</style>
</head>

<script>
const app=document.getElementById("app");
const connectionPanel=document.getElementById("connectionPanel");
const connectionView=document.getElementById("connectionView");
const forwardView=document.getElementById("forwardView");
const forwardEditor=document.getElementById("forwardEditor");
const terminalOutput=document.getElementById("terminalOutput");

function setPanelView(view){
  [connectionView,forwardView,forwardEditor].forEach((node)=>node.hidden=node!==view);
}

document.getElementById("openForward").onclick=()=>setPanelView(forwardView);
document.getElementById("backConnection").onclick=()=>setPanelView(connectionView);
document.getElementById("addForward").onclick=()=>setPanelView(forwardEditor);
document.getElementById("backForwardList").onclick=()=>setPanelView(forwardView);
document.getElementById("cancelForwardEdit").onclick=()=>setPanelView(forwardView);

const authSelect=document.getElementById("authSelect");
const authMenu=document.getElementById("authMenu");
const authLabel=document.getElementById("authLabel");
const authBlocks={
  password:document.getElementById("passwordAuth"),
  privateKey:document.getElementById("keyAuth"),
  agent:document.getElementById("agentAuth")
};
authSelect.querySelector(".rivet-select-trigger").onclick=()=>{
  authMenu.hidden=!authMenu.hidden;
};
authMenu.querySelectorAll(".rivet-select-option").forEach((option)=>{
  option.onclick=()=>{
    const value=option.dataset.value;
    authLabel.textContent=option.textContent;
    authMenu.querySelectorAll(".rivet-select-option").forEach((item)=>item.classList.toggle("is-selected",item===option));
    Object.entries(authBlocks).forEach(([key,node])=>node.hidden=key!==value);
    authMenu.hidden=true;
  };
});

const advancedToggle=document.getElementById("advancedToggle");
advancedToggle.onclick=()=>{
  advancedToggle.classList.toggle("is-collapsed");
  document.getElementById("advancedBody").hidden=advancedToggle.classList.contains("is-collapsed");
};

const jumpSwitch=document.getElementById("jumpSwitch");
jumpSwitch.onclick=()=>{
  jumpSwitch.classList.toggle("is-on");
  document.getElementById("jumpField").hidden=!jumpSwitch.classList.contains("is-on");
};

function closeForwardMenus(except=null){
  document.querySelectorAll(".ssh-forward-item").forEach((item)=>{
    if(item===except) return;
    item.querySelector(".ssh-forward-menu").hidden=true;
    item.querySelector('[data-action="more"]').classList.remove("active");
  });
}

function updateForwardCount(){
  document.getElementById("forwardCount").textContent=String(document.querySelectorAll(".ssh-forward-item").length);
}

document.querySelectorAll(".ssh-forward-item").forEach((item)=>{
  const menu=item.querySelector(".ssh-forward-menu");
  const more=item.querySelector('[data-action="more"]');
  const deleteConfirm=item.querySelector(".ssh-forward-delete");

  item.querySelector('[data-action="edit"]').onclick=()=>setPanelView(forwardEditor);
  item.querySelector('[data-action="edit-menu"]').onclick=()=>{
    menu.hidden=true;
    more.classList.remove("active");
    setPanelView(forwardEditor);
  };
  more.onclick=(event)=>{
    event.stopPropagation();
    const open=menu.hidden;
    closeForwardMenus(item);
    menu.hidden=!open;
    more.classList.toggle("active",open);
  };
  item.querySelector('[data-action="delete"]').onclick=()=>{
    menu.hidden=true;
    more.classList.remove("active");
    deleteConfirm.hidden=false;
  };
  item.querySelector('[data-action="cancel-delete"]').onclick=()=>deleteConfirm.hidden=true;
  item.querySelector('[data-action="confirm-delete"]').onclick=()=>{
    item.remove();
    updateForwardCount();
  };
});

document.addEventListener("mousedown",(event)=>{
  if(!event.target.closest("#authSelect")) authMenu.hidden=true;
  if(!event.target.closest(".ssh-forward-item")) closeForwardMenus();
});

function showTerminalAuth(){
  connectionPanel.style.display="none";
  terminalOutput.innerHTML='<span class="prototype-terminal-muted">Connecting to agile@10.28.228.244...</span>\n<span class="prototype-terminal-muted">SSH Agent authentication accepted.</span>\n<div class="prototype-auth-line"><span>Verification code: </span><input id="terminalAuthInput" class="prototype-auth-input" type="password" inputmode="numeric" autocomplete="one-time-code" aria-label="Verification code"></div>';
  const input=document.getElementById("terminalAuthInput");
  input.focus();
  input.onkeydown=(event)=>{
    if(event.key!=="Enter") return;
    event.preventDefault();
    terminalOutput.innerHTML='<span class="prototype-terminal-muted">Connecting to agile@10.28.228.244...</span>\n<span class="prototype-terminal-muted">SSH Agent authentication accepted.</span>\nVerification code: ••••••\n<span class="prototype-terminal-muted">Authentication successful.</span>\n\n<span class="prototype-terminal-user">agile@N305</span>:<span class="prototype-terminal-path">~</span>$ <span class="prototype-terminal-cursor"></span>';
  };
}

const params=new URLSearchParams(location.search);
if(params.get("theme")==="dark"){
  app.dataset.theme="dark";
  document.body.classList.add("prototype-dark-canvas");
}
if(params.get("focus")==="advanced"){
  const viewport=document.querySelector(".terminal-connection-form-viewport");
  viewport.scrollTop=viewport.scrollHeight;
}
if(params.get("jump")==="off"){
  jumpSwitch.classList.remove("is-on");
  document.getElementById("jumpField").hidden=true;
}
if(params.get("view")==="forward") setPanelView(forwardView);
if(params.get("view")==="editor") setPanelView(forwardEditor);
if(params.get("view")==="2fa") showTerminalAuth();
if(params.get("delete")){
  setPanelView(forwardView);
  const item=document.querySelector('[data-forward="'+params.get("delete")+'"]');
  if(item) item.querySelector(".ssh-forward-delete").hidden=false;
}
</script>
</body>
