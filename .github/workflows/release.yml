name: Release

# 正式发布工作流；普通源码提交不自动打包。

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - packaging/arch/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rivet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Rivet v__VERSION__
          releaseBody: |
            ## v0.2.0 更新内容

            - 重构桌面窗口体验：新增自定义标题栏、悬浮窗口样式与最大化适配，串口工具栏和终端标签可直接融入标题栏。
            - 新增分组管理与拖拽排序，串口快捷命令、终端连接和终端快捷命令均可统一调整分组顺序。
            - 新增终端历史命令补全与候选交互，持续优化精确匹配、编辑同步、滚动行为，并避免候选逻辑干扰 Shell 原生历史。
            - 完善 Windows PowerShell 集成：支持 PowerShell 5 / 7 历史命令、自动识别与默认版本选择，并统一 Shell Integration 初始化。
            - SSH 与串口终端新增断线/关闭后的重试连接入口，分屏场景下重试只作用于对应 Pane。
            - 新增快捷命令过滤，可按名称和命令内容快速筛选；串口与终端快捷命令样式进一步统一。
            - 修复 macOS 输入法、自动纠正、终端回显与历史候选状态同步等问题，提升跨平台终端输入稳定性。
            - 新增终端活动栏滚动条显示设置，并优化工具弹窗展开方向、分组排序界面、危险操作悬浮样式等细节。

            请在下方 Assets 下载对应平台的安装包。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  arch:
    name: publish (archlinux / omarchy)
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest

    steps:
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git github-cli base-devel nodejs pnpm rust \
            webkit2gtk-4.1 openssl appmenu-gtk-module \
            libappindicator librsvg xdotool xdg-utils shadow

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          git archive --format=tar.gz --prefix="rivet-${VERSION}/" -o "packaging/arch/rivet-${VERSION}.tar.gz" HEAD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild --clean"
          ls -lh packaging/arch/*.pkg.tar.zst

      - name: Upload Arch package to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in {1..60}; do
            if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release upload "v${VERSION}" packaging/arch/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
