name: Release

# 正式发布工作流；普通源码提交不自动打包。

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - packaging/arch/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rivet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Rivet v__VERSION__
          releaseBody: |
            ## v0.1.2 更新内容

            - 新增同步通知设置，可分别控制本地改动、启动检查、窗口聚焦和手动同步的结果通知。
            - 同步与本地恢复改为无刷新热更新，应用配置后保留当前页面、串口日志和已有终端会话。
            - 完善 X11：设置的 X11 Server 地址现在会实际生效，并补充 Windows、Linux 与 macOS/XQuartz 的跨平台解析和认证处理。
            - 设置页新增 VcXsrv 与 XQuartz 下载入口，外部链接统一由桌面后端安全打开。
            - 终端快捷命令新增详情说明、展开/收起交互，并兼容旧版快捷命令数据。
            - 关于页新增 GitHub 项目地址，并更新 0.1.2 版本与开发时间线。

            请在下方 Assets 下载对应平台的安装包。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  arch:
    name: publish (archlinux / omarchy)
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest

    steps:
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git github-cli base-devel nodejs pnpm rust \
            webkit2gtk-4.1 openssl appmenu-gtk-module \
            libappindicator librsvg xdotool xdg-utils shadow

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          git archive --format=tar.gz --prefix="rivet-${VERSION}/" -o "packaging/arch/rivet-${VERSION}.tar.gz" HEAD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild --clean"
          ls -lh packaging/arch/*.pkg.tar.zst

      - name: Upload Arch package to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in {1..60}; do
            if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release upload "v${VERSION}" packaging/arch/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
