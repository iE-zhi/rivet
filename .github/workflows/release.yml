name: Release

# 正式发布工作流；普通源码提交不自动打包。

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - packaging/arch/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rivet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Rivet v__VERSION__
          releaseBody: |
            ## v0.1.9 更新内容

            - 优化下拉框展开行为：根据视口上下剩余空间自动选择向上或向下展开，空间不足时自动翻转。
            - 下拉菜单新增最大高度与滚动支持，长选项列表在小窗口和滚动容器中也能正常使用。
            - 新增统一的 PopupMenu 通用菜单组件，支持自动上下定位、滚动高度限制、左右对齐、禁用项和危险操作样式。
            - 串口快捷命令、SSH/终端连接、终端快捷命令以及 SFTP 文件操作菜单统一迁移到 PopupMenu，减少重复样式和交互差异。
            - 补充 PopupMenu 组件预览与组件规范，后续工具菜单统一复用同一基础组件。

            请在下方 Assets 下载对应平台的安装包。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  arch:
    name: publish (archlinux / omarchy)
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest

    steps:
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git github-cli base-devel nodejs pnpm rust \
            webkit2gtk-4.1 openssl appmenu-gtk-module \
            libappindicator librsvg xdotool xdg-utils shadow

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          git archive --format=tar.gz --prefix="rivet-${VERSION}/" -o "packaging/arch/rivet-${VERSION}.tar.gz" HEAD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --cleanbuild --clean"
          ls -lh packaging/arch/*.pkg.tar.zst

      - name: Upload Arch package to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in {1..60}; do
            if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release upload "v${VERSION}" packaging/arch/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
