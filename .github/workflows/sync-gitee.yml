name: Sync Release to Gitee

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-gitee.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    env:
      GITEE_OWNER: boo0ood
      GITEE_REPO: rivet
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check Gitee token
        shell: bash
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::Missing repository secret GITEE_TOKEN"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download GitHub release assets
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber
          gh release view "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,body \
            > github-release.json
          ls -lh release-assets

      - name: Create or update Gitee release
        id: gitee_release
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          NAME=$(jq -r '.name // empty' github-release.json)
          BODY=$(jq -r '.body // empty' github-release.json)

          if [ -z "$NAME" ]; then
            NAME="Rivet $TAG"
          fi

          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          AUTH_HEADER="Authorization: Bearer $GITEE_TOKEN"

          CURL_READ=(--silent --show-error --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors)

          REPO_STATUS=$(curl "${CURL_READ[@]}" -o gitee-repo.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            "$API")
          if [ "$REPO_STATUS" != "200" ]; then
            cat gitee-repo.json
            echo "::error::Failed to query Gitee repository, HTTP $REPO_STATUS"
            exit 1
          fi

          TARGET_BRANCH=$(jq -r '.default_branch // "master"' gitee-repo.json)

          TAG_STATUS=$(curl "${CURL_READ[@]}" -o gitee-tags.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            "$API/tags?per_page=100")
          if [ "$TAG_STATUS" != "200" ]; then
            cat gitee-tags.json
            echo "::error::Failed to query Gitee tags, HTTP $TAG_STATUS"
            exit 1
          fi

          if ! jq -e --arg tag "$TAG" '.[] | select(.name == $tag)' gitee-tags.json >/dev/null; then
            CREATE_TAG_STATUS=$(curl "${CURL_READ[@]}" -o gitee-tag-write.json -w "%{http_code}" \
              -X POST \
              -H "$AUTH_HEADER" \
              --data-urlencode "refs=$TARGET_BRANCH" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "tag_message=$NAME" \
              "$API/tags")
            if [ "$CREATE_TAG_STATUS" -lt 200 ] || [ "$CREATE_TAG_STATUS" -ge 300 ]; then
              cat gitee-tag-write.json
              echo "::error::Failed to create Gitee tag, HTTP $CREATE_TAG_STATUS"
              exit 1
            fi
          fi

          RELEASES_STATUS=$(curl "${CURL_READ[@]}" -o gitee-releases.json -w "%{http_code}" \
            -H "$AUTH_HEADER" \
            "$API/releases?per_page=100&direction=desc")
          if [ "$RELEASES_STATUS" != "200" ]; then
            cat gitee-releases.json
            echo "::error::Failed to query Gitee releases, HTTP $RELEASES_STATUS"
            exit 1
          fi

          RELEASE_ID=$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' gitee-releases.json | head -n1)

          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg branch "$TARGET_BRANCH" \
            --arg name "$NAME" \
            --arg body "$BODY" \
            '{
              tag_name: $tag,
              target_commitish: $branch,
              name: $name,
              body: $body,
              prerelease: false
            }')

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            WRITE_STATUS=$(curl "${CURL_READ[@]}" -o gitee-release.json -w "%{http_code}" \
              -X PATCH \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD" \
              "$API/releases/$RELEASE_ID")
          else
            WRITE_STATUS=$(curl "${CURL_READ[@]}" -o gitee-release.json -w "%{http_code}" \
              -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD" \
              "$API/releases")
          fi

          if [ "$WRITE_STATUS" -lt 200 ] || [ "$WRITE_STATUS" -ge 300 ]; then
            cat gitee-release.json
            echo "::error::Failed to create/update Gitee release, HTTP $WRITE_STATUS"
            exit 1
          fi

          RELEASE_ID=$(jq -r '.id' gitee-release.json)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            cat gitee-release.json
            echo "::error::Gitee release ID is missing"
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Replace Gitee release assets
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="${{ steps.gitee_release.outputs.release_id }}"
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          AUTH_HEADER="Authorization: Bearer $GITEE_TOKEN"

          curl --fail --silent --show-error --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors \
            -H "$AUTH_HEADER" \
            "$API/releases/$RELEASE_ID/attach_files?per_page=100" \
            > gitee-assets.json

          jq -r '.[].id' gitee-assets.json | while read -r ASSET_ID; do
            [ -n "$ASSET_ID" ] || continue
            curl --fail --silent --show-error --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors \
              -X DELETE \
              -H "$AUTH_HEADER" \
              "$API/releases/$RELEASE_ID/attach_files/$ASSET_ID"
          done

          find release-assets -maxdepth 1 -type f -print0 | while IFS= read -r -d '' FILE; do
            echo "Uploading $(basename "$FILE")"
            curl --fail --silent --show-error --connect-timeout 20 --max-time 900 --retry 3 --retry-delay 5 --retry-all-errors \
              -X POST \
              -H "$AUTH_HEADER" \
              -F "file=@$FILE" \
              "$API/releases/$RELEASE_ID/attach_files"
          done
