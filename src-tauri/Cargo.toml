[package]
name = "rivet"
version = "0.2.3"
description = "Rivet cross-platform serial console"
authors = ["Rivet"]
edition = "2021"

[package.metadata.tauri-winres]
ProductName = "Rivet"
FileDescription = "Rivet serial console"

[lib]
name = "rivet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.4.3"
portable-pty = "=0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }
ring = "0.17"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.0"
serial2 = "=0.2.38"
sysinfo = "=0.39.6"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
tempfile = "3"
# VNC 客户端协议引擎；固定已审查的 MIT/Apache-2.0 版本。
vnc-rs = "=0.6.0"

[dev-dependencies]
# 独立 SFTP 集成测试启动系统 OpenSSH 子进程，不进入生产运行时。
tokio = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
