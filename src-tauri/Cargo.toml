[package]
name = "rivet"
version = "0.2.4"
description = "Rivet cross-platform serial console"
authors = ["Rivet"]
edition = "2021"

[package.metadata.tauri-winres]
ProductName = "Rivet"
FileDescription = "Rivet serial console"

[lib]
name = "rivet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# VNC 在正常复制粘贴时读写系统纯文本剪贴板，复用跨平台实现。
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.4.3"
portable-pty = "=0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }
ring = "0.17"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.0"
serial2 = "=0.2.38"
sysinfo = "=0.39.6"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
tempfile = "3"
# VNC 协议引擎的 0.6.0 副本，向画面调度器报告 RFB 更新边界。
vnc-rs = { version = "=0.6.0", path = "vendor/vnc-rs" }
# Apple 屏幕共享认证的协议算法；复用现有依赖图中的固定版本。
aes = { version = "=0.9.3", features = ["zeroize"] }
crypto-bigint = { version = "=0.7.5", features = ["alloc", "zeroize"] }
md5 = "=0.8.1"
zeroize = "=1.9.0"

[dev-dependencies]
# Apple 协议假服务器使用独立大整数实现核对 DH 结果，不进入生产认证路径。
num-bigint = "=0.5.1"
# 独立 SFTP 集成测试启动系统 OpenSSH 子进程，不进入生产运行时。
tokio = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
