[package]
name = "rivet"
version = "0.1.0"
description = "Rivet cross-platform serial console"
authors = ["Rivet"]
edition = "2021"

[package.metadata.tauri-winres]
ProductName = "Rivet"
FileDescription = "Rivet serial console"

[lib]
name = "rivet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
getrandom = "=0.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
portable-pty = "=0.9.0"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.0"
serial2 = "=0.2.38"
sysinfo = "=0.39.6"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
tempfile = "3"
